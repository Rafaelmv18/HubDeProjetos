# Hub de Projetos: os serviços do ambiente local.
# Subir:   docker compose up -d
# Parar:   docker compose down        (os dados continuam no volume)
# Zerar:   docker compose down -v     (apaga também os dados do banco)
#
# A cada etapa do plano entra um serviço novo (api, web, queue, reverb...).

name: hub

services:
  # --- Banco de dados ---
  db:
    image: postgres:18.6-alpine # versão fixa: atualizar de propósito, nunca por acaso
    container_name: hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}
    ports:
      # Aberto na máquina para você conectar com um cliente (DBeaver, pgAdmin...).
      # Fora do Docker é a 5433, para não brigar com um PostgreSQL instalado no Windows,
      # que costuma ocupar a 5432. Dentro do Docker continua 5432 (o Laravel usa db:5432).
      - "5433:5432"
    volumes:
      # A partir do PostgreSQL 18, os dados ficam em /var/lib/postgresql
      - dados_postgres:/var/lib/postgresql
      # Scripts rodados só na primeira vez que o banco é criado
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Os outros serviços vão esperar o banco ficar pronto antes de subir
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Back-end (Laravel) ---
  api:
    build: ./backend
    image: hub-api
    container_name: hub-api
    restart: unless-stopped
    environment:
      # Os dados do banco vêm do .env da raiz, para ficarem em um lugar só
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Os testes usam o banco hub_testes (definido em backend/phpunit.xml)
      # E-mail: tudo o que o Laravel envia vai para o Mailpit (nada sai da máquina)
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit # o nome do serviço abaixo
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: nao-responda@hub.local
      MAIL_FROM_NAME: Hub de Projetos
      # Os testes do Pest não usam o Mailpit: guardam os e-mails na memória (phpunit.xml)
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # A API está pronta quando a rota de saúde responde (ela também confere o banco)
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/saude || exit 1"]
      start_period: 15m  # a primeira subida instala o Composer e pode levar ~8 min
      start_interval: 3s # enquanto sobe, confere a cada 3 s
      interval: 60s      # depois de pronta, só uma vez por minuto (cada checagem aparece no log)
      timeout: 5s
      retries: 3
    # Sem "ports": a porta 8000 é interna. O navegador chega pelo Vite (D30).

  # --- Front-end (React + Vite) ---
  web:
    image: node:26.13.0-alpine # versão fixa: atualizar de propósito, nunca por acaso
    container_name: hub-web
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["sh", "/app/docker/entrypoint.sh"]
    command: ["npm", "run", "dev"]
    environment:
      VITE_API_URL: http://api:8000
    ports:
      - "5173:5173" # o endereço que você abre no navegador
    volumes:
      - ./frontend:/app
    depends_on:
      api:
        condition: service_healthy # só sobe quando a API já responde
    healthcheck:
      # O front-end está pronto quando a página responde.
      # Sem isto, o Docker diria "pronto" com o npm ainda instalando.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ > /dev/null || exit 1"]
      start_period: 10m  # a primeira subida instala o npm e pode levar alguns minutos
      start_interval: 3s # enquanto sobe, confere a cada 3 s
      interval: 60s      # depois de pronto, só uma vez por minuto
      timeout: 5s
      retries: 3

  # --- E-mail de desenvolvimento (Mailpit) ---
  # Um servidor de e-mail falso: recebe o que o Laravel envia e mostra numa página,
  # sem repassar para ninguém. Abra http://localhost:8025 para ler os e-mails.
  mailpit:
    image: axllent/mailpit:v1.33.1 # versão fixa: atualizar de propósito, nunca por acaso
    container_name: hub-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # a caixa de entrada, no navegador
    # Sem a porta 1025 (SMTP) em "ports": só o Laravel entrega e-mails, por dentro do Docker.
    # Os e-mails ficam na memória e somem quando o contêiner reinicia.
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      start_period: 30s
      start_interval: 2s
      interval: 60s
      timeout: 5s
      retries: 3

  # --- Testes de ponta a ponta (Playwright) ---
  # Não sobe com "docker compose up -d". Roda só quando é chamado:
  #     docker compose run --rm e2e
  e2e:
    # Imagem oficial, que já vem com o navegador.
    # A versão precisa ser a mesma do @playwright/test em e2e/package.json.
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    profiles: ["e2e"] # o "profile" é o que tira este serviço do "up -d"
    working_dir: /e2e
    entrypoint: ["sh", "/e2e/docker/entrypoint.sh"]
    command: ["npx", "playwright", "test"]
    environment:
      # Dentro do Docker, o front-end é alcançado pelo nome do serviço
      E2E_BASE_URL: http://web:5173
    init: true # encerra direito os processos do navegador
    ipc: host # recomendado pelo Playwright: evita o Chromium ficar sem memória
    volumes:
      - ./e2e:/e2e
    depends_on:
      web:
        condition: service_healthy # só roda quando a página já responde

volumes:
  dados_postgres:
